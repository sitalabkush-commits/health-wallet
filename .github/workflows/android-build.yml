name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Run unit tests
        shell: bash
        run: gradle testDebugUnitTest --no-daemon --console=plain 2>&1 | tee build.log

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee -a build.log

      - name: Verify the APK has no INTERNET permission
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -n 1)
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk
          if "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission found - failing build"; exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Runs only when something above failed: puts the real errors at the very bottom of the log.
      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          echo "=========== KOTLIN / KSP ERRORS ==========="
          grep -E "^e: |^error: |\.kt:[0-9]+" build.log | head -40 || true
          echo "=========== WHAT WENT WRONG ==========="
          grep -A6 "What went wrong" build.log | head -30 || true
